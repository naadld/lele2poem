name: "Poem Video Product QC Gatekeeper"

on:
  workflow_dispatch:
    inputs:
      row_id:
        description: 'Row ID on Google Sheet (#)'
        required: true
        default: '2'
      poem_id:
        description: 'Poem Project ID (e.g. 01_yong_e)'
        required: false
        default: '01_yong_e'

concurrency:
  group: poem-qc-${{ github.event.inputs.row_id }}
  cancel-in-progress: true

jobs:
  qc_inspection:
    name: "Gatekeeper 2: Product Quality Control"
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: "1. Checkout Repository"
        uses: actions/checkout@v4

      - name: "2. Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "3. Install FFmpeg & Media Utilities"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: "4. Install Python Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "5. Download Rendered Video Artifact"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: poem-video-${{ github.event.inputs.row_id }}
          path: projects/${{ github.event.inputs.poem_id }}/output/

      - name: "6. Execute Video Physical QC Inspection"
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY || secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROW_ID: ${{ github.event.inputs.row_id }}
          POEM_ID: ${{ github.event.inputs.poem_id }}
        run: |
          python scripts/run_poem_qc.py --row-id "${ROW_ID}"

      - name: "7. Final Cleanup of Video Artifacts after QC Pass"
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ROW_ID: ${{ github.event.inputs.row_id }}
          POEM_ID: ${{ github.event.inputs.poem_id }}
        run: |
          echo "🧹 QC đã thông qua, đang dọn dẹp video artifact trên GitHub..."
          python scripts/cleanup_artifacts.py --row-id "${ROW_ID}" --poem-id "${POEM_ID}" --delete-video || echo "Cleanup completed."
