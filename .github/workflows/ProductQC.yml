name: Poem Video Product QC Gatekeeper

on:
  workflow_dispatch:
    inputs:
      row_id:
        description: 'Row ID on Google Sheet (#)'
        required: true
        default: '2'

concurrency:
  group: poem-qc-${{ github.event.inputs.row_id }}
  cancel-in-progress: true

jobs:
  qc_inspection:
    name: Gatekeeper 2 Product QC
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto-QC Inspector
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY || secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROW_ID: ${{ github.event.inputs.row_id }}
        run: |
          python scripts/run_poem_qc.py --row-id "${ROW_ID}"
