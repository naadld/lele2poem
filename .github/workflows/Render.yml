name: "Poem Video Render Pipeline (1080x1920 60fps)"

on:
  workflow_dispatch:
    inputs:
      row_id:
        description: 'Row ID on Google Sheet (#)'
        required: true
        default: '2'
      poem_id:
        description: 'Poem Project ID (e.g. 01_yong_e)'
        required: false
        default: '01_yong_e'

concurrency:
  group: poem-render-${{ github.event.inputs.row_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  render_video:
    name: "9:16 Vertical Video Renderer"
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: "1. Checkout Repository"
        uses: actions/checkout@v4

      - name: "2. Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "3. Install FFmpeg & CJK Vietnamese Fonts"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk fonts-dejavu-core

      - name: "4. Install Python Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "5. Download Voice Artifacts (poem-voice-${{ github.event.inputs.row_id }})"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: poem-voice-${{ github.event.inputs.row_id }}
          path: projects/${{ github.event.inputs.poem_id }}/audio/

      - name: "6. Render 9:16 Video (1080x1920 60fps) & Upload Google Drive (OAuth 2.0)"
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY || secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          ROW_ID: ${{ github.event.inputs.row_id }}
          POEM_ID: ${{ github.event.inputs.poem_id }}
        run: |
          python scripts/run_poem_render.py --row-id "${ROW_ID}" --poem-id "${POEM_ID}"

      - name: "7. Save Rendered Video as GitHub Artifact (poem-video-${{ github.event.inputs.row_id }})"
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: poem-video-${{ github.event.inputs.row_id }}
          path: projects/${{ github.event.inputs.poem_id }}/output/
          retention-days: 7

      - name: "8. Cleanup Residual GitHub Artifacts"
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ROW_ID: ${{ github.event.inputs.row_id }}
          POEM_ID: ${{ github.event.inputs.poem_id }}
        run: |
          echo "🧹 Đang dọn dẹp các artifact audio tạm thời trên GitHub..."
          python scripts/cleanup_artifacts.py --row-id "${ROW_ID}" --poem-id "${POEM_ID}" || echo "Artifact cleanup completed."

      - name: "9. Trigger Product QC Pipeline (ProductQC.yml)"
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ROW_ID: ${{ github.event.inputs.row_id }}
          POEM_ID: ${{ github.event.inputs.poem_id }}
        run: |
          echo "⚡ Tự động kích hoạt ProductQC.yml cho Dòng #${ROW_ID}..."
          gh workflow run ProductQC.yml -f row_id="${ROW_ID}" -f poem_id="${POEM_ID}" || echo "Warning: QC trigger completed or skipped."

      - name: "10. Notify Failure to Telegram"
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CHAT_ID="${TELEGRAM_CHAT_ID:-1187577977}"
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            MSG="🚨 <b>[GitHub Actions Lỗi] Pipeline Render Video Thơ Thất Bại!</b>%0A%0A• <b>Workflow:</b> <code>Render.yml</code>%0A• <b>Dòng (#):</b> #${{ github.event.inputs.row_id }}%0A• <b>Run ID:</b> <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">${{ github.run_id }}</a>"
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=${MSG}" \
              -d "parse_mode=HTML" || true
          fi
