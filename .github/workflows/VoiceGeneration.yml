name: OmniVoice Voice Generation

on:
  workflow_dispatch:
    inputs:
      row_id:
        description: 'Row ID on Google Sheet (#)'
        required: true
        default: '2'
      poem_id:
        description: 'Poem Project ID (e.g. 01_yong_e)'
        required: false
        default: '01_yong_e'

concurrency:
  group: poem-voice-${{ github.event.inputs.row_id }}
  cancel-in-progress: true

jobs:
  synthesize_voice:
    name: OmniVoice Zero-Shot Voice Cloning
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install System Audio & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: 4. Cache Pip Wheels & HuggingFace Model Weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: ${{ runner.os }}-omnivoice-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-omnivoice-
            ${{ runner.os }}-pip-

      - name: 5. Install PyTorch & OmniVoice Engine
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --extra-index-url https://download.pytorch.org/whl/cpu
          pip install git+https://github.com/k2-fsa/OmniVoice.git
          pip install -r requirements.txt

      - name: 6. OmniVoice: Synthesize Sentence Audios (line_1.wav -> line_4.wav)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY || secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          ROW_ID: ${{ github.event.inputs.row_id }}
          POEM_ID: ${{ github.event.inputs.poem_id }}
        run: |
          python scripts/generate_poem_voice.py --row-id "${ROW_ID}" --poem-id "${POEM_ID}" --action synthesize

      - name: 7. Master Audio Merge: Combining Lines -> full_poem.wav
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY || secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          ROW_ID: ${{ github.event.inputs.row_id }}
          POEM_ID: ${{ github.event.inputs.poem_id }}
        run: |
          python scripts/generate_poem_voice.py --row-id "${ROW_ID}" --poem-id "${POEM_ID}" --action merge

      - name: 8. Upload Voice Assets to Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY || secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          ROW_ID: ${{ github.event.inputs.row_id }}
          POEM_ID: ${{ github.event.inputs.poem_id }}
        run: |
          python scripts/generate_poem_voice.py --row-id "${ROW_ID}" --poem-id "${POEM_ID}" --action upload

      - name: 9. Generate GitHub Step Summary Dashboard
        if: always()
        env:
          ROW_ID: ${{ github.event.inputs.row_id }}
          POEM_ID: ${{ github.event.inputs.poem_id }}
        run: |
          python scripts/generate_poem_voice.py --row-id "${ROW_ID}" --poem-id "${POEM_ID}" --action summary || true

      - name: 10. Auto-Trigger Render Pipeline (Render.yml)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ROW_ID: ${{ github.event.inputs.row_id }}
        run: |
          echo "⚡ Tự động kích hoạt Render.yml cho Dòng #${ROW_ID}..."
          gh workflow run Render.yml -f row_id="${ROW_ID}" || echo "Warning: Render dispatch completed or skipped."
